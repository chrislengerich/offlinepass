<!doctype html>
<html>
<head><meta charset="utf-8"><title>offlinepass</title>
<style>
body{font-family:system-ui,sans-serif;max-width:44em;margin:1em auto;padding:0 1em}
input,textarea{width:100%;box-sizing:border-box;margin:.2em 0}
button{margin:.2em .3em .2em 0;padding:.4em .9em}
.row{display:flex;gap:.5em;align-items:center}
.list li{cursor:pointer;padding:.3em 0;border-bottom:1px solid #eee;list-style:none}
.pw{font-family:monospace}
#log{max-height:9em;overflow:auto;background:#f4f4f4;padding:.6em;font-size:.85em;white-space:pre-wrap}
.hidden{display:none}
canvas{border:1px solid #ccc}
video{max-width:20em}
</style>
</head>
<body>
<h1>offlinepass</h1>
<div id="log"></div>

<!-- THE SETTINGS -->
<section id="settings">
  <h2>Sync</h2>
  <label>The repo's HTTPS URL<br><input id="url" placeholder="https://github.com/user/repo.git"></label>
  <label>The token<br><input id="token" type="password"></label>
  <div class="row">
    <button id="btnClone">Clone</button>
    <button id="btnSync">Sync now</button>
    <label>or the vault file: <input id="file" type="file" accept=".gpg"></label>
  </div>
</section>

<!-- THE ENTRIES -->
<section id="entries" class="hidden">
  <h2>Entries <span id="count"></span></h2>
  <div class="row">
    <button id="btnAdd">Add entry</button>
    <button id="btnSyncTop">Sync</button>
    <button id="btnImport">QRFT import</button>
  </div>
  <ul id="list" class="list"></ul>
</section>

<!-- THE DETAIL -->
<section id="detail" class="hidden">
  <div class="row"><button id="btnBack">← Back</button><strong id="dName"></strong></div>
  <label>Name<input id="eName"></label>
  <label>URLs<input id="eUrls" placeholder="comma-separated"></label>
  <label>Username<input id="eUser"></label>
  <label>Email<input id="eEmail"></label>
  <label>Password<input id="ePass" class="pw"></label>
  <label>TOTP URI<input id="eTotp"></label>
  <label>Notes<textarea id="eNote" rows="3"></textarea></label>
  <div class="row">
    <button id="btnSave">Save</button>
    <button id="btnDel">Delete</button>
    <button id="btnQr">QRFT → phone</button>
  </div>
  <canvas id="qr" class="hidden"></canvas>
</section>

<!-- THE QRFT IMPORT -->
<section id="qrftImport" class="hidden">
  <h2>QRFT import</h2>
  <video id="video" autoplay muted playsinline></video>
  <div id="qrStatus"></div>
  <button id="btnQrCancel">Cancel</button>
</section>

<script src="lib/lightning-fs.min.js"></script>
<script src="lib/isogit.umd.min.js"></script>
<script src="lib/isogit-http.umd.js"></script>
<script src="vendor/pako.min.js"></script>
<script src="lib/qrft.js"></script>
<script src="lib/qrcode.js"></script>
<script src="lib/jsQR.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
