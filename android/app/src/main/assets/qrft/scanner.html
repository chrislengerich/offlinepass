<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR File Scanner (offline)</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: Arial, sans-serif; margin: 0; background: #111; color: #eee; }
      .wrap { max-width: 640px; margin: 0 auto; padding: 12px; }
      #msg { font-size: 1rem; margin: 0 0 8px; color: #ffd75e; min-height: 1.4em; }
      #progress { font-size: 0.85rem; color: #9fe29f; min-height: 1.2em; margin-bottom: 8px; }
      video { width: 100%; border-radius: 8px; background: #000; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="msg">Starting camera…</div>
      <div id="progress"></div>
      <video id="v" autoplay playsinline muted></video>
    </div>
    <canvas id="c" hidden></canvas>
    <script src="vendor/jsQR.js"></script>
    <script src="vendor/pako.min.js"></script>
    <script>
      (function () {
        var msg = document.getElementById("msg");
        var progress = document.getElementById("progress");
        var video = document.getElementById("v");
        var canvas = document.getElementById("c");
        var ctx = canvas.getContext("2d", { willReadFrequently: true });

        var chunks = {};          // index -> Uint8Array
        var total = -1;           // from the metadata frame
        var name = "";
        var size;                 // declared payload size (may be absent)
        var rawBytes = 0;
        var done = false;
        var rawMode = location.search.indexOf("mode=raw") >= 0;

        // Resource caps, ported verbatim from ~/3p/airgap-qr-offline's
        // scanner: a hostile QR must not exhaust memory (decompression
        // bomb) or steer the transfer with a bogus metadata frame.
        var MAX_CHUNKS = 1000000;
        var MAX_SIZE = 3 * 1024 * 1024 * 1024;
        var MAX_INFLATED = 3 * 1024 * 1024 * 1024; // cap when no size declared
        var INFLATE_SLACK = 1024 * 1024;           // slack over a declared size

        var valid_meta = function (m) {
          if (!m || typeof m !== "object" || Array.isArray(m)) return false;
          if (typeof m.name !== "string" || m.name.length > 5000) return false;
          if (!Number.isInteger(m.chunks) || m.chunks < 1 || m.chunks > MAX_CHUNKS) return false;
          if (m.size !== undefined && m.size !== null) {
            if (!Number.isInteger(m.size) || m.size < 0 || m.size > MAX_SIZE) return false;
          }
          return true;
        };

        var safe_inflate = function (data, max_out) {
          var inflator = new pako.Inflate();
          var parts = [], outTotal = 0;
          inflator.onData = function (chunk) {
            parts.push(chunk);
            outTotal += chunk.length;
            if (outTotal > max_out) {
              throw new Error("decompressed data exceeds " + max_out + " bytes");
            }
          };
          var STEP = 1 << 16;
          for (var i = 0; i < data.length; i += STEP) {
            inflator.push(data.subarray(i, Math.min(i + STEP, data.length)));
            if (inflator.err) {
              throw new Error(inflator.msg || "inflate failed");
            }
            if (inflator.ended) break;
          }
          if (!inflator.ended) {
            throw new Error("truncated deflate stream");
          }
          var bytes = new Uint8Array(outTotal);
          var off = 0;
          for (var p = 0; p < parts.length; p++) { bytes.set(parts[p], off); off += parts[p].length; }
          return bytes;
        };

        var b64ToBytes = function (b64) {
          // The generator encodes chunks as UTF-8 of the Latin-1 byte string
          // before base64 (upstream encode_data) — invert that here, or any
          // payload byte >= 0x80 (i.e. every gzip stream) is corrupted.
          var bin = atob(b64);
          var raw = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) raw[i] = bin.charCodeAt(i);
          var str = new TextDecoder().decode(raw);
          return Uint8Array.from(str, function (c) { return c.charCodeAt(0); });
        };

        var stopCamera = function () {
          try {
            var s = video.srcObject;
            if (s) s.getTracks().forEach(function (t) { t.stop(); });
          } catch (e) {}
        };

        var finish = function () {
          done = true;
          stopCamera();
          var rawLen = 0;
          for (var i = 0; i < total; i++) rawLen += chunks[i].length;
          var raw = new Uint8Array(rawLen);
          var off = 0;
          for (var i = 0; i < total; i++) { raw.set(chunks[i], off); off += chunks[i].length; }
          var bytes;
          try {
            bytes = safe_inflate(raw, size !== undefined ? size + INFLATE_SLACK : MAX_INFLATED);
          } catch (e) {
            msg.textContent = "Corrupt transfer: " + e.message;
            return;
          }
          var text = new TextDecoder().decode(bytes);
          progress.textContent = "Complete: " + name + " (" + bytes.length + " bytes).";
          msg.textContent = "Received \"" + name + "\" — importing…";
          // Hand the payload to the app (bridge call hops to the main thread).
          setTimeout(function () {
            if (window.OfflinepassBridge && window.OfflinepassBridge.onPayload) {
              window.OfflinepassBridge.onPayload(name, text);
            } else {
              msg.textContent = "Bridge missing — payload not delivered.";
            }
          }, 300);
        };

        var handle = function (data) {
          if (done) return;
          if (rawMode) {
            // THE RAW MODE (the TOTP enrollment): any decoded QR is handed
            // to the app as-is — the otpauth:// URI needs no reassembly.
            done = true;
            stopCamera();
            msg.textContent = "Scanned — handing to the app…";
            setTimeout(function () {
              if (window.OfflinepassBridge && window.OfflinepassBridge.onPayload) {
                window.OfflinepassBridge.onPayload("totp", data);
              }
            }, 300);
            return;
          }
          if (data.charAt(0) === "{") {
            try {
              var m = JSON.parse(data);
              if (total < 0 && valid_meta(m)) {
                total = m.chunks;
                name = String(m.name || "payload");
                size = m.size;
                msg.textContent = "Receiving \"" + name + "\"";
                progress.textContent = "0 / " + total + " chunks";
              } else if (total < 0 && !valid_meta(m)) {
                msg.textContent = "Invalid transfer metadata — ignoring.";
              }
            } catch (e) {}
            return;
          }
          var ci = data.indexOf(",");
          if (ci <= 0 || total < 0) return;
          var idx = parseInt(data.slice(0, ci), 10);
          if (isNaN(idx) || idx < 0 || idx >= total) return;
          if (chunks[idx] === undefined) {
            chunks[idx] = b64ToBytes(data.slice(ci + 1));
            rawBytes += chunks[idx].length;
            var cap = Math.min((size !== undefined ? size : 0) + INFLATE_SLACK, MAX_INFLATED);
            if (rawBytes > cap) {
              msg.textContent = "Transfer exceeds size cap — aborted.";
              done = true;
              stopCamera();
              return;
            }
            var got = Object.keys(chunks).length;
            progress.textContent = got + " / " + total + " chunks";
            if (got === total) finish();
          }
        };

        var scanLoop = function () {
          if (done) return;
          requestAnimationFrame(scanLoop);
          if (video.readyState < 2 || video.videoWidth === 0) return;
          var scale = Math.min(1, 720 / video.videoWidth);
          canvas.width = Math.round(video.videoWidth * scale);
          canvas.height = Math.round(video.videoHeight * scale);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var code = jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
          if (code && code.data) handle(code.data);
        };

        var start = function () {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            msg.textContent = "Camera API unavailable (insecure origin?).";
            return;
          }
          navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 1280 } },
            audio: false
          }).then(function (stream) {
            video.srcObject = stream;
            video.play();
            msg.textContent = "Waiting for the sender's QR…";
            scanLoop();
          }).catch(function (e) {
            msg.textContent = "Camera failed: " + (e.message || e.name);
          });
        };
        start();
      })();
    </script>
  </body>
</html>
